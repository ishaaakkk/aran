name: E2E Tests

# The e2e suite is this repo's most effective bug finder (it produced findings
# F1–F24), so it also runs on merges to main rather than
# only overnight — a nightly-only signal means a regression is found the morning
# after and attributed to whichever of the day's merges is guessed first.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Run Playwright End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: aran-web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: aran-web
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: aran-web
        run: npx playwright install --with-deps chromium

      # `make aran-lake` cannot be used here for two reasons: it starts the DEV
      # compose stack (the suite's globalSetup owns its own stack on offset ports)
      # and it ends in `exec uvicorn --reload`, a foreground server that never
      # returns — so this step hung until the 60-minute job timeout. globalSetup
      # runs the migrations and starts both services itself; all it needs is the
      # venv, with freyja's dependencies in it (it launches freyja from the lake
      # venv, which nothing here installed).
      - name: Bootstrap Lake venv (no containers, no server)
        run: make aran-lake-venv freyja-deps

      # p1-mcp-live-client.spec.ts execs aran-mcp/.venv/bin/python directly
      # (execFileSync, no existence check) to drive a real MCP client subprocess
      # against this run's live Aran. Nothing else in this job creates that venv —
      # globalSetup only touches the lake venv — so without this step the spec
      # fails with ENOENT on every fresh checkout.
      - name: Bootstrap aran-mcp venv (p1-mcp-live-client.spec.ts execs it directly)
        run: make aran-mcp

      - name: Run E2E Suite
        working-directory: aran-web
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: aran-web/playwright-report/
          retention-days: 14

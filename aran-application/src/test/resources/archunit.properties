# ArchitectureTest's frozen-rule store. Committed: it is the ratchet. A path relative to the
# module directory, which is the Gradle test worker's working directory.
freeze.store.default.path=src/test/resources/archunit-store
# Never create a store implicitly: a missing store would be frozen at whatever the tree holds
# that day and pass.
freeze.store.default.allowStoreCreation=false
# Never write to the store implicitly either. With updates allowed (ArchUnit's default), a frozen
# rule whose text was edited is simply added to the store under its new text — every violation it
# has that day frozen, and the run green. Locked, that edit fails, and so does a fixed violation
# until the store is moved on purpose. ArchitectureTest's javadoc has the command; this file stays
# false in every commit, which ArchitectureTest also checks.
freeze.store.default.allowStoreUpdate=false

[alembic]
# Migration scripts live here. Versions are sequential, content-keyed
# (we never re-number a migration once it ships).
script_location = alembic

# Async support: alembic uses the asyncpg URL the service uses at runtime.
# In CI/local: read from ARAN_LAKE_DATABASE_URL via env.py.
sqlalchemy.url =

# Don't try to be too clever about timezone-naive vs aware. We use
# TIMESTAMPTZ for everything.
timezone =

# File-naming template: NNN_short-slug.py
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[post_write_hooks]
# Optional formatting step — left disabled for portability.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

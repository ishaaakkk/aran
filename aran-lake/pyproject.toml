[project]
name = "aran-lake"
version = "0.1.0"
description = "Aran data-lake service — DuckDB query engine over S3-compatible object storage"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "Aran / DTAK group, UPC Barcelona" },
]

dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.35,<3.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "alembic>=1.13.0,<2.0.0",
    # Floor raised to 1.5.5 to match the Java side's duckdbJdbcVersion (build.gradle):
    # both read the same parquet artifacts, so the engines must not drift. The <2.0.0
    # cap is deliberate and is the same decision the Java pin documents — DuckDB 2.0
    # rewrites the SQL parser, and the screen below (_FORBIDDEN) matches on names.
    "duckdb>=1.5.5,<2.0.0",
    "pyarrow>=17.0.0,<21.0.0",
    "boto3>=1.35.0,<2.0.0",
    "botocore>=1.35.0,<2.0.0",
    "structlog>=24.4.0,<26.0.0",
    "httpx>=0.27.0,<1.0.0",
]
# NOTE: the FREYJA sidecar's deps (jellyfish, scikit-learn, pandas, …) live in
# freyja/requirements.txt. The sidecar shares this venv for convenience
# (`make freyja-sidecar` installs them there), but they are not aran-lake deps.

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "testcontainers[postgres]>=4.8.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "types-boto3>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aran_lake"]

# ruff configuration lives in the repo-root ruff.toml so freyja and aran-client
# are covered by the same ruleset; ruff walks up to find it.
[tool.mypy]
python_version = "3.12"
strict_optional = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:botocore.*",
]

[project]
name = "aran-mcp"
version = "0.1.0"
description = "MCP server exposing Aran data products to an agent you already run"
readme = "README.md"
# The MCP SDK requires 3.10; aran-client's own floor is 3.9. This package sets
# the higher of the two rather than dragging aran-client's up.
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Aran / DTAK group, UPC Barcelona" },
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]

# aran-client carries the HTTP, the auth header, the TLS policy and the
# problem-detail decoding. This package adds an MCP shell and nothing else; if
# it ever grows its own httpx call, that is the signal something belongs in the
# client instead.
dependencies = [
    "mcp>=2.0.0,<3.0.0",
    "aran-client>=0.1.0",
]

[project.scripts]
aran-mcp = "aran_mcp.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aran_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

# Aran login theme.
#
# Extends Keycloak's own base+keycloak.v2 login theme rather than replacing it: every
# FreeMarker template, every form field, every error message and — importantly — the
# whole set of authentication flows Keycloak knows how to render (OTP, required actions,
# identity-provider redirects) comes for free and keeps working when Keycloak is upgraded.
# This theme is CSS. A fork of the templates would look identical on day one and drift on
# the first Keycloak upgrade.
#
# The point of it is not decoration: a user installing Aran should never see an interface
# they have no context for. Keycloak stays the authentication authority and stops being
# something anyone is aware of.
parent=keycloak.v2
import=common/keycloak

styles=css/login.css
